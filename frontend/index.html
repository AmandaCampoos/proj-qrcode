<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Define a codificação dos caracteres -->
    <meta charset="UTF-8">

    <!-- Faz a página se adaptar ao celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR da Sala</title>

    <!-- Importa nosso arquivo CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!--
        Container principal da aplicação.
        Tudo ficará centralizado dentro dele.
    -->
    <main class="container">

        <!-- Cabeçalho -->
        <header class="header">

            <div class="logo">
                QR<span>+</span>
            </div>

            <p class="subtitle">
                Comunicação rápida de problemas
            </p>

        </header>


        <!--
            Card principal.
            Aqui futuramente vamos preencher
            os dados reais da sala através da API.
        -->
        <section class="room-card">

            <div class="room-icon">
                🏫
            </div>

            <p class="room-label">
                VOCÊ ESTÁ NA
            </p>

            <h1>
                Sala 204
            </h1>

            <p class="room-location">
                Bloco B · Laboratório de Informática
            </p>

        </section>


        <!-- Área do formulário -->
        <section class="problem-section">

            <h2>
                Encontrou algum problema?
            </h2>

            <p class="instruction">
                Selecione o que precisa de atenção.
            </p>


            <!--
                Lista de categorias.
                Por enquanto os botões são apenas visuais.
                Depois vamos conectar ao JavaScript.
            -->
            <div class="problem-grid">

                <button class="problem-option">
                    <span class="problem-icon">📽️</span>
                    <span>Projetor</span>
                </button>

                <button class="problem-option">
                    <span class="problem-icon">🌐</span>
                    <span>Internet</span>
                </button>

                <button class="problem-option">
                    <span class="problem-icon">💡</span>
                    <span>Iluminação</span>
                </button>

                <button class="problem-option">
                    <span class="problem-icon">❄️</span>
                    <span>Ar-condicionado</span>
                </button>

                <button class="problem-option">
                    <span class="problem-icon">🔌</span>
                    <span>Tomada</span>
                </button>

                <button class="problem-option">
                    <span class="problem-icon">🧹</span>
                    <span>Limpeza</span>
                </button>

                <button class="problem-option other-option">
                    <span class="problem-icon">•••</span>
                    <span>Outro</span>
                </button>

            </div>


            <!-- Descrição -->
            <div class="description-container">

                <label for="description">
                    Quer explicar melhor? <span>(opcional)</span>
                </label>

                <textarea
                    id="description"
                    placeholder="Ex.: O projetor não está ligando..."
                    rows="4">
                </textarea>

            </div>


            <!-- Botão de envio -->
            <button class="submit-button">
                Registrar problema
                <span>→</span>
            </button>

        </section>


        <!-- Rodapé -->
        <footer>

            <p>
                QR da Sala · Comunicação simples, solução rápida.
            </p>

        </footer>

    </main>

</body>

</html>
