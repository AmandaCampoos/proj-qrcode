<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QR da Sala</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main class="container">

        <!-- Cabeçalho -->
        <header class="header">

            <div class="logo">
                QR<span>+</span>
            </div>

            <p class="subtitle">
                Comunicação rápida de problemas
            </p>

        </header>


        <!-- Identificação da sala -->
        <section class="room-card">

            <div class="room-icon">
                🏫
            </div>

            <p class="room-label">
                VOCÊ ESTÁ NA
            </p>

            <!--
                O JavaScript preencherá este campo
                com o nome retornado pela API.
            -->
            <h1 id="room-name">
                Sala 204
            </h1>

            <!--
                A localização também será carregada
                dinamicamente pela API.
            -->
            <p
                id="room-location"
                class="room-location"
            >
                Bloco B · Laboratório de Informática
            </p>

        </section>


        <!-- Formulário de registro -->
        <section class="problem-section">

            <h2>
                Encontrou algum problema?
            </h2>

            <p class="instruction">
                Selecione o que precisa de atenção.
            </p>


            <!-- Categorias -->
            <div class="problem-grid">

                <button
                    type="button"
                    class="problem-option"
                    data-categoria="projetor"
                >
                    <span class="problem-icon">
                        📽️
                    </span>

                    <span>
                        Projetor
                    </span>
                </button>


                <button
                    type="button"
                    class="problem-option"
                    data-categoria="internet"
                >
                    <span class="problem-icon">
                        🌐
                    </span>

                    <span>
                        Internet
                    </span>
                </button>


                <button
                    type="button"
                    class="problem-option"
                    data-categoria="iluminacao"
                >
                    <span class="problem-icon">
                        💡
                    </span>

                    <span>
                        Iluminação
                    </span>
                </button>


                <button
                    type="button"
                    class="problem-option"
                    data-categoria="ar_condicionado"
                >
                    <span class="problem-icon">
                        ❄️
                    </span>

                    <span>
                        Ar-condicionado
                    </span>
                </button>


                <button
                    type="button"
                    class="problem-option"
                    data-categoria="tomada"
                >
                    <span class="problem-icon">
                        🔌
                    </span>

                    <span>
                        Tomada
                    </span>
                </button>


                <button
                    type="button"
                    class="problem-option"
                    data-categoria="limpeza"
                >
                    <span class="problem-icon">
                        🧹
                    </span>

                    <span>
                        Limpeza
                    </span>
                </button>


                <button
                    type="button"
                    class="problem-option other-option"
                    data-categoria="outro"
                >
                    <span class="problem-icon">
                        •••
                    </span>

                    <span>
                        Outro
                    </span>
                </button>

            </div>


            <!-- Descrição -->
            <div class="description-container">

                <label for="description">

                    Quer explicar melhor?

                    <span>
                        (opcional)
                    </span>

                </label>


                <textarea
                    id="description"
                    placeholder="Ex.: O projetor não está ligando..."
                    rows="4"
                ></textarea>

            </div>


            <!--
                Área destinada às mensagens de retorno
                da API.
            -->
            <div
                id="message"
                class="form-message"
                role="alert"
            ></div>


            <!-- Botão de envio -->
            <button
                type="button"
                id="submit-button"
                class="submit-button"
            >

                <span id="submit-text">
                    Registrar problema
                </span>

                <span>
                    →
                </span>

            </button>

        </section>


        <!-- Rodapé -->
        <footer>

            <p>
                QR da Sala · Comunicação simples,
                solução rápida.
            </p>

        </footer>

    </main>


    <!--
        Carrega o JavaScript responsável pela
        interação da página e comunicação com a API.
    -->
    <script src="js/sala.js"></script>

</body>

</html>
